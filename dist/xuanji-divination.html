<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄机 · 多维度命理占卜</title>
  <meta name="description" content="融合塔罗牌、西方占星、生命数字学与八字四柱的多维度人格洞察占卜" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <style>
:root {
  --bg-0: #07060f;
  --bg-1: #110b22;
  --bg-2: #1a1136;
  --ink: #ece8ff;
  --ink-dim: #b3a9d6;
  --ink-faint: #7c7299;
  --gold: #e9c46a;
  --gold-bright: #f6d98a;
  --violet: #9d6bff;
  --violet-soft: #6d4fb3;
  --rose: #ff7eb6;
  --teal: #5fe3c7;
  --line: rgba(157, 107, 255, 0.22);
  --card-bg: rgba(26, 17, 54, 0.62);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --radius: 16px;
  font-synthesis: none;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 800px at 15% -10%, #2a1a55 0%, transparent 55%),
    radial-gradient(1000px 700px at 110% 10%, #3a1d4d 0%, transparent 50%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 60%, #05040a 100%);
  min-height: 100vh;
  line-height: 1.65;
  overflow-x: hidden;
}

/* ---------- starfield ---------- */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: 0.7;
  animation: twinkle var(--dur, 4s) ease-in-out infinite alternate;
}
@keyframes twinkle {
  from { opacity: 0.15; transform: scale(0.7); }
  to   { opacity: 0.95; transform: scale(1.1); }
}

/* ---------- header ---------- */
.site-header {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 48px 20px 18px;
}
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.brand-mark {
  color: var(--gold);
  font-size: 1.4rem;
  filter: drop-shadow(0 0 10px rgba(233, 196, 106, 0.6));
}
.site-header h1 {
  margin: 0;
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  letter-spacing: 0.35em;
  font-weight: 700;
  background: linear-gradient(120deg, var(--gold-bright), var(--rose), var(--violet));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-sub {
  color: var(--ink-dim);
  letter-spacing: 0.3em;
  font-size: 0.85rem;
}
.tagline {
  margin: 14px auto 0;
  max-width: 640px;
  color: var(--ink-dim);
  font-size: 0.95rem;
  letter-spacing: 0.04em;
}

/* ---------- layout ---------- */
.layout {
  position: relative;
  z-index: 1;
  max-width: 940px;
  margin: 0 auto;
  padding: 12px 18px 40px;
  display: grid;
  gap: 26px;
}

.panel {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
}
.panel-title {
  margin: 0 0 18px;
  font-size: 1.15rem;
  letter-spacing: 0.12em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.rune { color: var(--gold); }

/* ---------- form ---------- */
.field { margin-bottom: 16px; display: flex; flex-direction: column; }
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
label {
  font-size: 0.85rem;
  color: var(--ink-dim);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.hint { color: var(--ink-faint); font-size: 0.72rem; }

input, select, textarea {
  width: 100%;
  background: rgba(8, 6, 18, 0.6);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  padding: 11px 13px;
  font-size: 0.95rem;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input::placeholder, textarea::placeholder { color: var(--ink-faint); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--violet);
  box-shadow: 0 0 0 3px rgba(157, 107, 255, 0.18);
}
textarea { resize: vertical; }
select option { background: var(--bg-2); color: var(--ink); }

.cast-btn {
  width: 100%;
  margin-top: 6px;
  padding: 14px 18px;
  border: none;
  border-radius: 12px;
  font-size: 1.05rem;
  letter-spacing: 0.18em;
  font-family: inherit;
  font-weight: 600;
  color: #1a1024;
  cursor: pointer;
  background: linear-gradient(120deg, var(--gold-bright), var(--gold) 55%, #d9a94f);
  box-shadow: 0 10px 30px rgba(233, 196, 106, 0.32);
  transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
}
.cast-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(233, 196, 106, 0.45); filter: brightness(1.05); }
.cast-btn:active { transform: translateY(0); }
.cast-icon { margin-right: 6px; }

/* ---------- result ---------- */
.result { animation: rise 0.5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.result-head { text-align: center; margin-bottom: 18px; }
.result-greeting {
  margin: 0;
  font-size: 1.5rem;
  letter-spacing: 0.06em;
  background: linear-gradient(120deg, var(--gold-bright), var(--rose));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.result-meta { color: var(--ink-dim); font-size: 0.9rem; margin: 6px 0 0; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 22px;
}
.tab {
  background: rgba(8, 6, 18, 0.5);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 0.9rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.04em;
}
.tab:hover { color: var(--ink); border-color: var(--violet); }
.tab.active {
  color: #1a1024;
  background: linear-gradient(120deg, var(--gold-bright), var(--gold));
  border-color: transparent;
  font-weight: 600;
}

.tab-panel { display: none; animation: fade 0.4s ease both; }
.tab-panel.active { display: block; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- tarot cards ---------- */
.spread-intro { color: var(--ink-dim); margin: 0 0 20px; font-size: 0.92rem; }
.tarot-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.tcard {
  perspective: 1000px;
  cursor: pointer;
}
.tcard-inner {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 5;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4, 0.1, 0.2, 1);
}
.tcard.flipped .tcard-inner { transform: rotateY(180deg); }
.tcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 12px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.tcard-back {
  background:
    repeating-linear-gradient(45deg, rgba(157,107,255,0.10) 0 8px, transparent 8px 16px),
    radial-gradient(circle at 50% 35%, #3a2470, #1a1136 70%);
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-size: 2rem;
}
.tcard-back span { filter: drop-shadow(0 0 12px rgba(233,196,106,0.6)); }
.tcard-front {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, #241652, #150d2e);
  padding: 12px;
  text-align: center;
  justify-content: space-between;
}
.tcard-pos { font-size: 0.72rem; color: var(--gold); letter-spacing: 0.12em; }
.tcard-symbol { font-size: 2.2rem; margin: 4px 0; }
.tcard-name { font-size: 0.98rem; font-weight: 600; line-height: 1.3; }
.tcard-arcana { font-size: 0.68rem; color: var(--ink-faint); }
.tcard-orient {
  font-size: 0.74rem;
  padding: 2px 8px;
  border-radius: 999px;
  display: inline-block;
  margin-top: 4px;
}
.orient-up { background: rgba(95,227,199,0.16); color: var(--teal); }
.orient-rev { background: rgba(255,126,182,0.16); color: var(--rose); }
.tcard.reversed .tcard-symbol { transform: rotate(180deg); }

.card-readings { display: grid; gap: 14px; }
.reading {
  background: rgba(8,6,18,0.45);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold);
  border-radius: 10px;
  padding: 14px 16px;
}
.reading h4 { margin: 0 0 6px; font-size: 1rem; }
.reading h4 .pos-tag { color: var(--gold); font-size: 0.78rem; margin-right: 8px; letter-spacing: 0.1em; }
.reading .kw { color: var(--violet); font-size: 0.82rem; margin: 0 0 6px; }
.reading p { margin: 0; color: var(--ink-dim); font-size: 0.9rem; }

/* ---------- generic content ---------- */
.lead {
  font-size: 1.05rem;
  color: var(--ink);
  margin: 0 0 18px;
  padding: 14px 18px;
  border-radius: 12px;
  background: linear-gradient(120deg, rgba(157,107,255,0.14), rgba(233,196,106,0.08));
  border: 1px solid var(--line);
}
.big-number {
  font-size: 3.4rem;
  font-weight: 700;
  line-height: 1;
  background: linear-gradient(120deg, var(--gold-bright), var(--rose));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin: 0 0 20px;
}
.stat {
  background: rgba(8,6,18,0.45);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.stat .label { font-size: 0.76rem; color: var(--ink-faint); letter-spacing: 0.08em; }
.stat .value { font-size: 1.3rem; font-weight: 600; margin-top: 4px; }
.stat .value small { font-size: 0.8rem; color: var(--ink-dim); font-weight: 400; }

.block { margin-bottom: 18px; }
.block h3 {
  font-size: 1.02rem;
  margin: 0 0 8px;
  color: var(--gold-bright);
  letter-spacing: 0.05em;
}
.block p { margin: 0 0 8px; color: var(--ink-dim); font-size: 0.92rem; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0; }
.tag {
  background: rgba(157,107,255,0.14);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.8rem;
}

/* ---------- bazi pillars ---------- */
.pillars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.pillar {
  text-align: center;
  background: rgba(8,6,18,0.5);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 8px;
}
.pillar .p-label { font-size: 0.74rem; color: var(--ink-faint); letter-spacing: 0.1em; }
.pillar .p-stem, .pillar .p-branch {
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1.2;
}
.pillar .p-stem { color: var(--gold-bright); }
.pillar .p-branch { color: var(--violet); }
.pillar .p-elem { font-size: 0.74rem; color: var(--ink-dim); margin-top: 4px; }

/* element bars */
.elem-bars { display: grid; gap: 10px; margin: 6px 0 0; }
.elem-bar { display: grid; grid-template-columns: 40px 1fr 34px; align-items: center; gap: 10px; }
.elem-bar .e-name { font-size: 0.86rem; }
.elem-bar .e-track { background: rgba(8,6,18,0.6); border-radius: 999px; height: 12px; overflow: hidden; border: 1px solid var(--line); }
.elem-bar .e-fill { height: 100%; border-radius: 999px; transition: width 0.8s ease; }
.elem-bar .e-count { font-size: 0.82rem; color: var(--ink-dim); text-align: right; }
.e-木 { background: linear-gradient(90deg, #3fae6b, #6fe39a); }
.e-火 { background: linear-gradient(90deg, #e0533b, #ff8a6a); }
.e-土 { background: linear-gradient(90deg, #c79a4a, #e9c46a); }
.e-金 { background: linear-gradient(90deg, #b9c2cc, #eef3f8); }
.e-水 { background: linear-gradient(90deg, #3a7bd5, #5fc7e3); }

/* synthesis */
.synth-axes { display: grid; gap: 14px; margin-bottom: 20px; }
.axis {
  background: rgba(8,6,18,0.45);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.axis .a-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.axis .a-icon { font-size: 1.2rem; }
.axis .a-title { font-weight: 600; }
.axis .a-from { color: var(--ink-faint); font-size: 0.78rem; margin-left: auto; }
.axis p { margin: 0; color: var(--ink-dim); font-size: 0.9rem; }

.advice {
  margin-top: 8px;
  padding: 16px 18px;
  border-radius: 12px;
  background: linear-gradient(120deg, rgba(233,196,106,0.12), rgba(255,126,182,0.10));
  border: 1px solid var(--line);
}
.advice h3 { margin: 0 0 8px; color: var(--gold-bright); }
.advice ul { margin: 0; padding-left: 20px; }
.advice li { color: var(--ink-dim); margin-bottom: 6px; font-size: 0.92rem; }

/* ---------- actions / misc ---------- */
.result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 26px; }
.ghost-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 999px;
  padding: 10px 20px;
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}
.ghost-btn:hover { color: var(--ink); border-color: var(--gold); }

.site-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 24px 20px 50px;
  color: var(--ink-faint);
  font-size: 0.78rem;
}
.site-footer p { max-width: 560px; margin: 0 auto; }

.hidden { display: none !important; }

/* ---------- responsive ---------- */
@media (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; }
  .tarot-grid { grid-template-columns: 1fr; max-width: 240px; margin-inline: auto; }
  .pillars { grid-template-columns: repeat(2, 1fr); }
  .panel { padding: 20px; }
}

</style>
</head>
<body>
  <div id="starfield" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <h1>玄机</h1>
      <span class="brand-sub">多维度命理占卜</span>
    </div>
    <p class="tagline">塔罗 · 占星 · 生命数字 · 八字四柱 — 四重视角，照见人格全貌</p>
  </header>

  <main class="layout">
    <!-- 输入区 -->
    <section class="panel input-panel" aria-label="占卜信息输入">
      <h2 class="panel-title"><span class="rune">☉</span> 启卦信息</h2>
      <form id="divine-form" autocomplete="off">
        <div class="field">
          <label for="name">姓名 <span class="hint">（可选，用于生命数字与称谓）</span></label>
          <input type="text" id="name" name="name" placeholder="例如：林微 / Lin Wei" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="birthdate">出生日期 <span class="hint">（公历）</span></label>
            <input type="date" id="birthdate" name="birthdate" required
                   min="1900-01-01" max="2099-12-31" value="1995-06-15" />
          </div>
          <div class="field">
            <label for="birthtime">出生时辰 <span class="hint">（可选）</span></label>
            <select id="birthtime" name="birthtime">
              <option value="">未知</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="gender">性别 <span class="hint">（八字参考）</span></label>
            <select id="gender" name="gender">
              <option value="unknown">不愿透露</option>
              <option value="female">女</option>
              <option value="male">男</option>
            </select>
          </div>
          <div class="field">
            <label for="focus">关注领域</label>
            <select id="focus" name="focus">
              <option value="general">综合人格</option>
              <option value="love">感情</option>
              <option value="career">事业</option>
              <option value="wealth">财富</option>
              <option value="growth">成长</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="question">想问的问题 <span class="hint">（默契凝神，写下心中所惑）</span></label>
          <textarea id="question" name="question" rows="2"
                    placeholder="例如：我接下来半年的事业重心应放在何处？"></textarea>
        </div>

        <button type="submit" class="cast-btn">
          <span class="cast-icon">✶</span> 凝神 · 起卦
        </button>
      </form>
    </section>

    <!-- 结果区 -->
    <section id="result" class="result hidden" aria-live="polite">
      <div class="result-head">
        <h2 id="result-greeting" class="result-greeting"></h2>
        <p id="result-meta" class="result-meta"></p>
      </div>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="tarot" role="tab">🃏 塔罗牌</button>
        <button class="tab" data-tab="numerology" role="tab">🔢 生命数字</button>
        <button class="tab" data-tab="astrology" role="tab">🌌 星盘</button>
        <button class="tab" data-tab="bazi" role="tab">🀄 八字四柱</button>
        <button class="tab" data-tab="synthesis" role="tab">✺ 综合洞察</button>
      </nav>

      <div class="tab-panels">
        <div class="tab-panel active" data-panel="tarot"></div>
        <div class="tab-panel" data-panel="numerology"></div>
        <div class="tab-panel" data-panel="astrology"></div>
        <div class="tab-panel" data-panel="bazi"></div>
        <div class="tab-panel" data-panel="synthesis"></div>
      </div>

      <div class="result-actions">
        <button id="reshuffle" class="ghost-btn">↻ 重新洗牌</button>
        <button id="restart" class="ghost-btn">✎ 重新起卦</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>本占卜融合塔罗象征、西方占星、生命数字学与八字四柱，仅供自我观照与娱乐参考，不构成任何专业建议。</p>
  </footer>

  <script>
/* =============================================================
   data.js — 静态命理数据
   塔罗（大阿尔卡那 + 小阿尔卡那生成规则）、占星、生命数字、八字
   ============================================================= */

/* ---------- 塔罗：大阿尔卡那 22 张 ---------- */
const MAJOR_ARCANA = [
  { n: 0,  name: "愚者",     en: "The Fool",          sym: "🌅",
    up:  { kw: "天真 · 启程 · 自由 · 无限可能", txt: "崭新的旅程在脚下展开，带着孩童般的信任纵身一跃。放下计算，拥抱未知，机缘往往藏在你不设防的那一步。" },
    rev: { kw: "鲁莽 · 逃避 · 犹豫 · 风险", txt: "可能过于冲动或反过来畏缩不前。提醒你在跳跃之前先看清脚下，别让天真变成对现实的回避。" } },
  { n: 1,  name: "魔术师",   en: "The Magician",      sym: "✨",
    up:  { kw: "创造 · 行动 · 资源 · 显化", txt: "你已握有实现意图的全部工具——意志、技巧与时机。专注当下，把想法转化为行动，世界会回应你的笃定。" },
    rev: { kw: "操控 · 拖延 · 自我怀疑 · 散漫", txt: "才华尚未对准目标，或被用于操弄。收回外散的能量，先厘清你真正想显化的是什么。" } },
  { n: 2,  name: "女祭司",   en: "The High Priestess", sym: "🌙",
    up:  { kw: "直觉 · 潜意识 · 神秘 · 静观", txt: "答案不在喧嚣处，而在内心的静默里。信任那一闪而过的直觉，给自己留白，让潜意识浮现讯息。" },
    rev: { kw: "压抑直觉 · 秘密 · 表里不一", txt: "你或许忽略了内在的声音，被表象牵着走。重新向内倾听，诚实面对自己隐藏的感受。" } },

/* ---------- 工具：确定性随机（同样的信息 → 同样的卦象） ---------- */
function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- 构建完整 78 张塔罗牌 ---------- */
function buildDeck() {
  const deck = MAJOR_ARCANA.map((c) => ({
    type: "major",

    sym: c.sym,

    rev: c.rev,
  }));

    RANKS.forEach((rk) => {
      const isCourt = rk.r > 10;
      const name = isCourt ? `${s.name}${rk.cn}` : `${s.name}${rk.cn}`;
      deck.push({
        type: "minor",
        name,
        en: `${rk.label} of ${s.key}`,
        sym: s.sym,
        arcana: `小阿尔卡那 · ${s.name}（${s.element}）`,

        rev: { kw: `${s.element}（逆位） · ${rk.rev}`, txt: `逆位的${s.name}提醒你留意${s.theme}方面的阻滞：${rk.rev}。在${s.focus}上，先向内调整再行动。` },
      });
    });
  });
  return deck;
}
const FULL_DECK = buildDeck();

/* ---------- 数字归约（保留大师数 11/22/33） ---------- */
function reduceNumber(n, keepMaster = true) {
  function sumDigits(x) {
    return String(x).split("").reduce((a, d) => a + (parseInt(d, 10) || 0), 0);
  }
  let v = n;
  while (v > 9) {
    if (keepMaster && (v === 11 || v === 22 || v === 33)) return v;
    v = sumDigits(v);
  }
  return v;
}

/* ---------- 生命数字 ---------- */
function calcNumerology(y, m, d, name) {
  const lifeRaw = reduceNumber(
    reduceNumber(y, false) + reduceNumber(m, false) + reduceNumber(d, false)
  );
  const lifePath = LIFE_PATH[lifeRaw] ? lifeRaw : reduceNumber(lifeRaw, false);
  const birthdayNum = reduceNumber(d, false);

  // 表达数（仅当姓名含拉丁字母时计算）
  let expression = null;
  if (name && /[a-zA-Z]/.test(name)) {
    const map = {};
    "abcdefghijklmnopqrstuvwxyz".split("").forEach((ch, i) => (map[ch] = (i % 9) + 1));
    let sum = 0;
    for (const ch of name.toLowerCase()) if (map[ch]) sum += map[ch];
    if (sum > 0) expression = reduceNumber(sum);
  }
  return { lifePath, lifeData: LIFE_PATH[lifePath], birthdayNum, birthdayTxt: BIRTHDAY_NUM[birthdayNum], expression };
}

/* ---------- 占星：太阳星座 + 生肖 ---------- */
function getSunSign(m, d) {
  for (const s of SUN_SIGNS) {
    const [fm, fd] = s.from, [tm, td] = s.to;
    if (fm === tm) { if (m === fm && d >= fd && d <= td) return s; }
    else if ((m === fm && d >= fd) || (m === tm && d <= td)) return s;
  }
  return SUN_SIGNS[9]; // 摩羯（跨年兜底）
}

/* ---------- 八字四柱 ---------- */
function julianDay(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4)
    - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}

// 月支对应（按节气近似：寅=2月…），返回 0-11，对应正月寅起的序号
function solarMonthBranchOrder(m, d) {
  // 各月节气近似日（交节日，之前归上一月）
  const termDay = [0, 6, 4, 6, 5, 6, 6, 7, 8, 8, 8, 7, 7]; // index=月份(1-12)
  let order = m - 2; // 2月→寅(order0)
  if (d < termDay[m]) order -= 1; // 未到交节，归上一个节气月
  order = ((order % 12) + 12) % 12;
  return order; // 0=寅,1=卯,...
}

function calcBazi(y, m, d, hourBranch /* 0-11 或 null */) {
  // 立春近似：2月4日前算上一年
  let baziYear = y;
  if (m < 2 || (m === 2 && d < 4)) baziYear = y - 1;

  const yStem = ((baziYear - 4) % 10 + 10) % 10;
  const yBranch = ((baziYear - 4) % 12 + 12) % 12;

  const monthOrder = solarMonthBranchOrder(m, d);          // 0=寅
  const mBranch = (2 + monthOrder) % 12;                    // 寅=2
  const mStem = ((yStem % 5) * 2 + 2 + monthOrder) % 10;    // 五虎遁

  const dayIdx = (((julianDay(y, m, d) - 2451551) % 60) + 60) % 60; // 0=甲子
  const dStem = dayIdx % 10;
  const dBranch = dayIdx % 12;

  let hour = null;
  if (hourBranch !== null && hourBranch !== undefined) {
    const hStem = ((dStem % 5) * 2 + hourBranch) % 10; // 五鼠遁
    hour = { stem: hStem, branch: hourBranch };
  }

  const pillars = [
    { label: "年柱", stem: yStem, branch: yBranch },
    { label: "月柱", stem: mStem, branch: mBranch },
    { label: "日柱", stem: dStem, branch: dBranch },
  ];
  if (hour) pillars.push({ label: "时柱", stem: hour.stem, branch: hour.branch });

  // 五行统计（含天干 + 地支主气）
  const elemCount = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
  pillars.forEach((p) => {
    elemCount[STEM_ELEM[p.stem]]++;
    elemCount[BRANCH_ELEM[p.branch]]++;
  });

  return {
    pillars,
    baziYear,
    dayMaster: dStem,                 // 日主天干
    dayElem: STEM_ELEM[dStem],
    dayYin: STEM_YIN[dStem],
    elemCount,
    zodiac: ZODIAC[yBranch],          // 以年支定生肖（与立春一致）
  };
}

/* ---------- 塔罗抽牌 ---------- */
function drawTarot(rng, count) {
  const idx = FULL_DECK.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const picks = [];
  for (let k = 0; k < count; k++) {
    const card = FULL_DECK[idx[k]];
    const reversed = rng() < 0.42;
    picks.push({ card, reversed });
  }
  return picks;
}

  const dmYin = bazi.dayYin ? "阴" : "阳";
  panel.appendChild(el("div", "lead",
    `你的<b>日主</b>为 <b>${STEMS[bazi.dayMaster]}（${dmYin}${bazi.dayElem}）</b>，这是八字的核心——代表「你自己」。${esc(STEM_PERSONA[STEMS[bazi.dayMaster]])}`));

  const pillars = el("div", "pillars");
  bazi.pillars.forEach((p) => {
    pillars.appendChild(el("div", "pillar",
      `<div class="p-label">${p.label}</div>
       <div class="p-stem">${STEMS[p.stem]}</div>
       <div class="p-branch">${BRANCHES[p.branch]}</div>
       <div class="p-elem">${STEM_ELEM[p.stem]} · ${BRANCH_ELEM[p.branch]}</div>`));
  });
  panel.appendChild(pillars);

  if (!hasHour) {
    panel.appendChild(el("p", "spread-intro", "（未填出生时辰，故略去时柱；填入可得更完整的四柱。）"));
  }

  // 日主五行解读
  panel.appendChild(el("div", "block", `<h3>日主五行 · ${bazi.dayElem}</h3><p>${esc(ELEM_READING[bazi.dayElem])}</p>`));

  // 五行分布
  const total = Object.values(bazi.elemCount).reduce((a, b) => a + b, 0) || 1;
  const bars = el("div", "elem-bars");
  ["木", "火", "土", "金", "水"].forEach((e) => {
    const c = bazi.elemCount[e];
    const pct = Math.round((c / total) * 100);
    bars.appendChild(el("div", "elem-bar",
      `<span class="e-name">${e}</span>
       <span class="e-track"><span class="e-fill e-${e}" style="width:${pct}%"></span></span>
       <span class="e-count">${c}</span>`));
  });
  const balBlock = el("div", "block", `<h3>五行分布</h3>`);
  balBlock.appendChild(bars);
  panel.appendChild(balBlock);

  // 旺缺建议
  const entries = Object.entries(bazi.elemCount);
  const maxE = entries.reduce((a, b) => (b[1] > a[1] ? b : a));
  const missing = entries.filter(([, c]) => c === 0).map(([e]) => e);
  let advice = `命局中 <b>${maxE[0]}</b> 之气最旺，是你最突出的特质来源。`;
  if (missing.length) {
    advice += `相对而言 <b>${missing.join("、")}</b> 较弱或缺失，可在生活中有意识地补足——例如多接触相应的颜色、方位与活动，以求五行流通、性情更圆融。`;
  } else {
    advice += `五行大致俱全，能量较为流通，性情多面而平衡。`;
  }
  panel.appendChild(el("div", "block", `<h3>旺衰提点</h3><p>${advice}</p>`));
}

function renderSynthesis(panel, ctx) {
  panel.innerHTML = "";
  const { num, sign, bazi, draws, name, focusLabel } = ctx;
  const present = draws[1];
  const pm = present.reversed ? present.card.rev : present.card.up;
  const who = name ? `${name}` : "你";

  panel.appendChild(el("div", "lead",
    `把四种体系叠在一起看，${esc(who)}的人格呈现出多层次的轮廓——
     <b>生命数字</b>道出此生的主驱动，<b>星盘</b>勾勒情绪与气质，<b>八字日主</b>揭示天生的本性，而<b>塔罗</b>照见当下的课题。四面棱镜，照见同一个你。`));

  const axes = el("div", "synth-axes");
  const axisData = [
    { icon: "🔢", title: "核心驱动", from: `生命灵数 ${num.lifePath}`,
      txt: `${esc(num.lifeData.title.split(" · ")[1] || num.lifeData.title)}是你内在的发动机：${esc(num.lifeData.kw.join("、"))}。这股力量在你做重大选择时最为明显。` },
    { icon: "🌌", title: "情绪气质", from: `${sign.name} · ${sign.element}象`,
      txt: `作为${esc(sign.element)}象的${esc(sign.name)}，你待人接物的温度与节奏偏向「${esc(sign.kw.slice(0,3).join("、"))}」，这决定了别人最先感受到的你。` },
    { icon: "🀄", title: "内在本性", from: `日主 ${STEMS[bazi.dayMaster]}（${bazi.dayElem}）`,
      txt: `${esc(STEM_PERSONA[STEMS[bazi.dayMaster]].split("。")[0])}——这是你卸下面具后、最本真的底色与脾性。` },
    { icon: "🃏", title: "当下课题", from: `塔罗 · ${present.card.name}`,
      txt: `此刻的你正经历「${esc(pm.kw)}」的能量。${esc(pm.txt)}` },
  ];
  axisData.forEach((a) => {
    axes.appendChild(el("div", "axis",
      `<div class="a-head"><span class="a-icon">${a.icon}</span>
        <span class="a-title">${esc(a.title)}</span>
        <span class="a-from">${esc(a.from)}</span></div>
       <p>${a.txt}</p>`));
  });
  panel.appendChild(axes);

  // 交叉洞察：数字 × 星座元素 × 日主
  const cross = crossInsight(num, sign, bazi);
  panel.appendChild(el("div", "block", `<h3>✺ 交叉洞察</h3><p>${esc(cross)}</p>`));

  // 行动建议（结合关注领域）
  const advice = adviceFor(ctx.focus, num, sign, bazi, present);
  const box = el("div", "advice", `<h3>给${esc(who)}的行动指引 · 聚焦「${esc(focusLabel)}」</h3>`);
  const ul = el("ul");
  advice.forEach((a) => ul.appendChild(el("li", null, esc(a))));
  box.appendChild(ul);
  panel.appendChild(box);
}

function crossInsight(num, sign, bazi) {
  const elemVibe = { "火": "外放而炽热", "土": "沉稳而务实", "风": "灵动而思辨", "水": "细腻而深情" };
  const dmElem = bazi.dayElem;
  const harmony = (sign.element === "火" && dmElem === "木") || (sign.element === "水" && dmElem === "木") ||
                  (sign.element === "土" && dmElem === "金") || (sign.element === "火" && dmElem === "土");
  let s = `星盘给你${elemVibe[sign.element]}的外在气质，而八字日主属${dmElem}，是更深一层的本性。`;
  if (sign.element === dmElem || ELEM_GENERATE[dmElem] === ({火:"火",土:"土",风:"金",水:"水"}[sign.element])) {
    s += `两者气场相合，意味着你的「表现」与「本心」较为一致，活得较为表里如一。`;
  } else {
    s += `两者略有张力——你呈现给世界的样子，和内心真实的需求未必完全同步，这份反差恰是你丰富与深度的来源。`;
  }
  s += ` 叠加生命灵数 ${num.lifePath} 的${num.lifeData.kw[0]}特质，使你在面对选择时，往往${num.lifePath % 2 === 1 ? "更倾向主动开创、亲自掌舵" : "更擅长协调权衡、借力而行"}。`;
  return s;
}

function adviceFor(focus, num, sign, bazi, present) {
  const base = {
    general: [
      `善用你生命灵数 ${num.lifePath} 的天赋（${num.lifeData.kw.slice(0,2).join("、")}），别在不擅长的赛道上硬耗。`,
      `${sign.name}的你，记得${sign.kw.includes("固执")||sign.kw.includes("犹豫")?"在坚持与灵活之间找平衡":"把热情用在真正重要的少数事上"}。`,
      `日主属${bazi.dayElem}，留意它的阴影面，适时${{"木":"修剪固执","火":"收敛急躁","土":"打破固守","金":"柔化刚硬","水":"安定心绪"}[bazi.dayElem]}。`,
    ],
    love: [
      `感情中，你的${sign.name}特质让你${sign.element==="水"?"重感受、易共情，但要避免把对方理想化":sign.element==="火"?"主动热烈，但需给对方回应的空间":sign.element==="土"?"踏实长情，但别用控制代替沟通":"擅长沟通，但别让理性盖过真心的流露"}。`,
      `生命灵数 ${num.lifePath} 提示：${num.lifePath===2||num.lifePath===6?"你天生重关系，但要先把爱留一份给自己":num.lifePath===1||num.lifePath===8?"独立强势的你，要学会示弱与并肩":"在亲密里保留自我，也向对方敞开内心"}。`,
      present.reversed ? `塔罗逆位提醒：当下感情或有需厘清的迷雾，先诚实面对自己的感受再表达。` : `塔罗正位显示：当下感情能量流动顺畅，适合真诚地推进一步。`,
    ],
    career: [
      `事业上，发挥${bazi.dayElem}日主的${{"木":"规划与成长力","火":"表现与领导力","土":"稳健与执行力","金":"果决与原则性","水":"灵活与谋略"}[bazi.dayElem]}。`,
      `生命灵数 ${num.lifePath}（${num.lifeData.kw[0]}）适合的路径：${num.lifePath===8?"管理、经营、与资源打交道":num.lifePath===1?"开创、主导、做第一个吃螃蟹的人":num.lifePath===3?"创意、表达、与人沟通的领域":num.lifePath===4||num.lifePath===22?"系统建造、长期工程":"发挥专长、稳步积累影响力"}。`,
      present.reversed ? `塔罗逆位：近期或有阻力或需调整方向，先稳住节奏再发力。` : `塔罗正位：能量在助推你，把握时机大胆推进。`,
    ],
    wealth: [
      `财富上，${bazi.dayElem}日主者宜${{"木":"靠成长性、长期布局获利","火":"靠人气、表现与机会","土":"靠踏实积累与不动产","金":"靠果断决策与专业","水":"靠灵活变通与信息差"}[bazi.dayElem]}。`,
      `生命灵数 ${num.lifePath}：${num.lifePath===8?"你对金钱有天然的掌控欲与能力，注意取之有道":num.lifePath===4?"稳健储蓄与规划是你的强项，避免过度保守":"先把钱用在能放大你天赋的地方"}。`,
      bazi.elemCount["金"] === 0 ? `命中金（财气相关之一）偏弱，理财宜更有纪律、量入为出。` : `财气流通尚可，关键在持续与节制。`,
    ],
    growth: [
      `成长的核心功课，藏在生命灵数 ${num.lifePath} 的阴影里：${num.lifeData.txt.split("功课")[1] ? "功课" + num.lifeData.txt.split("功课")[1] : "在天赋之外，补上你回避的那一课。"}`,
      `${sign.name}需要练习的，往往是${sign.kw[sign.kw.length-1]}的另一面。`,
      `让${bazi.dayElem}日主的能量流动起来：${{"木":"学会放下与柔软","火":"学会沉静与持久","土":"学会变通与冒险","金":"学会包容与圆融","水":"学会专注与扎根"}[bazi.dayElem]}。`,
    ],
  };
  return base[focus] || base.general;
}

/* =============================================================
   流程控制
   ============================================================= */
let lastCtx = null;
let shuffleSalt = 0;

function runDivination() {
  const name = $("#name").value.trim();
  const bd = $("#birthdate").value;
  if (!bd) { $("#birthdate").focus(); return; }
  const [y, m, d] = bd.split("-").map((x) => parseInt(x, 10));
  const btVal = $("#birthtime").value;
  const hourBranch = btVal === "" ? null : parseInt(btVal, 10);
  const gender = $("#gender").value;
  const focus = $("#focus").value;
  const question = $("#question").value.trim();

  const focusLabelMap = { general: "综合人格", love: "感情", career: "事业", wealth: "财富", growth: "成长" };
  const focusLabel = focusLabelMap[focus];

  // 计算
  const num = calcNumerology(y, m, d, name);
  const sign = getSunSign(m, d);
  const bazi = calcBazi(y, m, d, hourBranch);

  // 确定性随机种子
  const seedStr = `${name}|${bd}|${btVal}|${gender}|${focus}|${question}|${shuffleSalt}`;
  const rng = mulberry32(hashStr(seedStr));
  const draws = drawTarot(rng, 3);

  const ctx = { name, y, m, d, hourBranch, gender, focus, focusLabel, question, num, sign, bazi, draws };
  lastCtx = ctx;

  // 渲染头部
  const who = name || "旅人";
  $("#result-greeting").textContent = `${who}，星图已为你展开`;
  const parts = [`${y} 年 ${m} 月 ${d} 日`];
  if (hourBranch !== null) parts.push(SHICHEN[hourBranch].name);
  parts.push(`${sign.sym}${sign.name}`);
  parts.push(`生肖${bazi.zodiac.a}`);
  parts.push(`灵数 ${num.lifePath}`);
  $("#result-meta").textContent = parts.join(" · ") + (question ? `　|　所问：${question}` : "");

  // 渲染各面板
  renderTarot($('.tab-panel[data-panel="tarot"]'), draws, focusLabel);
  renderNumerology($('.tab-panel[data-panel="numerology"]'), num);
  renderAstrology($('.tab-panel[data-panel="astrology"]'), sign, num);
  renderBazi($('.tab-panel[data-panel="bazi"]'), bazi, hourBranch !== null);
  renderSynthesis($('.tab-panel[data-panel="synthesis"]'), ctx);

  // 显示结果并切到塔罗页
  $("#result").classList.remove("hidden");
  switchTab("tarot");
  $("#result").scrollIntoView({ behavior: "smooth", block: "start" });

  // 卡牌依次翻开动画
  const cards = document.querySelectorAll('.tab-panel[data-panel="tarot"] .tcard');
  cards.forEach((c) => c.classList.remove("flipped"));
  cards.forEach((c, i) => setTimeout(() => c.classList.add("flipped"), 250 + i * 320));
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === name));
}

/* ---------- 初始化 ---------- */
function initBirthtimeSelect() {
  const sel = $("#birthtime");
  SHICHEN.forEach((s) => {
    const o = document.createElement("option");
    o.value = String(s.idx);
    o.textContent = `${s.name}（${s.range}）`;
    sel.appendChild(o);
  });
}

function initStarfield() {
  const sf = $("#starfield");
  const n = Math.min(140, Math.floor((window.innerWidth * window.innerHeight) / 9000));
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 0.6;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--dur", (Math.random() * 4 + 2).toFixed(1) + "s");
    s.style.animationDelay = (Math.random() * 4).toFixed(1) + "s";
    sf.appendChild(s);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initBirthtimeSelect();
  initStarfield();

  $("#divine-form").addEventListener("submit", (e) => {
    e.preventDefault();
    shuffleSalt = 0;
    runDivination();
  });

  document.querySelectorAll(".tab").forEach((t) =>
    t.addEventListener("click", () => switchTab(t.dataset.tab)));

  $("#reshuffle").addEventListener("click", () => {
    if (!lastCtx) return;
    shuffleSalt++;
    runDivination();
  });

  $("#restart").addEventListener("click", () => {
    $("#result").classList.add("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("#name").focus();
  });
});
